apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: phishing
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      tolerations:
        - key: "project"
          operator: "Equal"
          value: "phishing"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: project
                    operator: In
                    values:
                      - phishing
      initContainers:
        - name: fetch-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - for i in $(seq 1 30); do wget -O /usr/share/nginx/html/index.html https://github.com/abdulrahmanx9/phishing-directory/raw/main/frontend/html/index.html && exit 0; echo "retry $i"; sleep 5; done; exit 1
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: pvc-frontend
