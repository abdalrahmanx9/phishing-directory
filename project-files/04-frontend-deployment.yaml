apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: phishing
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      tolerations:
        - key: "project"
          operator: "Equal"
          value: "phishing"
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: project
                    operator: In
                    values:
                      - phishing
      initContainers:
        - name: fetch-html
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -O /usr/share/nginx/html/index.html https://raw.githubusercontent.com/abdulrahmanx9/phishing-directory/main/frontend/html/index.html && echo "index.html fetched:" && head -c 200 /usr/share/nginx/html/index.html
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: pvc-frontend
